<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holo Agent</title>
    <!-- Libreria ufficiale Google Identity Services per il Calendario -->
    <script src="https://accounts.google.com/gsi/client" defer></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0a0e17;
            color: #e0f7fc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }
        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 10px;
            background: rgba(16, 26, 43, 0.8);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(0, 240, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        header input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
        }
        header button, .controls button {
            background: #00f0ff;
            color: #0a0e17;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        header button:hover, .controls button:hover {
            background: #70f6ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        .hologram-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 40px 0;
            width: 100%;
            max-width: 600px;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,240,255,0.4) 0%, rgba(10,14,23,0) 70%);
            border: 2px solid #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin-bottom: 25px;
            animation: pulse 3s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(0.98); box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
            100% { transform: scale(1.02); box-shadow: 0 0 30px rgba(0, 240, 255, 0.7); }
        }
        .speech-bubble {
            background: rgba(16, 26, 43, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            min-height: 100px;
            text-align: center;
            font-size: 1.1rem;
            line-height: 1.5;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .controls {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 10px;
            background: rgba(16, 26, 43, 0.8);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(0, 240, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        .controls input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: #fff;
            padding: 10px 14px;
            border-radius: 6px;
            outline: none;
        }
        #micBtn.listening {
            background: #ff0055;
            color: #fff;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <!-- Area Configurazione API Key -->
    <header>
        <input type="password" id="apiKeyInput" placeholder="Inserisci chiave OpenRouter (sk-or-v1-...)">
        <button onclick="saveApiKey()">Salva Chiave</button>
    </header>

    <!-- Avatar Olografico e Fumetto di Risposta -->
    <div class="hologram-container">
        <div class="avatar">🤖</div>
        <div class="speech-bubble" id="speechBubble">
            Ciao! Sono il tuo Holo Agent. Come posso aiutarti oggi?
        </div>
    </div>

    <!-- Pulsante Google Auth Nascosto (gestito automaticamente dallo script) -->
    <button id="authBtn" onclick="authenticateGoogle()" style="display: none;"></button>

    <!-- Barra dei Comandi Vocali e Testuali -->
    <div class="controls">
        <input type="text" id="textInput" placeholder="Scrivi un comando o chiedi qualcosa..." onkeypress="handleKeyPress(event)">
        <button onclick="sendText()">Invia</button>
        <button id="micBtn" onclick="toggleListening()">🎙️ Parla</button>
    </div>

    <script>
        // ==========================================
        // 1. CONFIGURAZIONE E VARIABILI GLOBALI
        // ==========================================
        
        // INSERISCI QUI IL TUO GOOGLE CLIENT ID
        const GOOGLE_CLIENT_ID = '365223537670-qq78cpra1rljkf3gd1iq3dpk654c68il.apps.googleusercontent.com'; 

        const speechBubble = document.getElementById('speechBubble');
        const textInput = document.getElementById('textInput');
        const micBtn = document.getElementById('micBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');

        let apiKey = localStorage.getItem('openrouter_api_key') || '';
        if (apiKey) {
            apiKeyInput.value = '••••••••••••••••';
        }

        let googleAccessToken = null;
        let tokenClient = null;

        // Richiedi subito il permesso per le notifiche del browser
        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        // Salva la chiave API di OpenRouter nel LocalStorage
        window.saveApiKey = function() {
            const val = apiKeyInput.value.trim();
            if (val && !val.startsWith('•')) {
                apiKey = val;
                localStorage.setItem('openrouter_api_key', apiKey);
                speechBubble.innerText = "Chiave OpenRouter salvata correttamente!";
                speak("Chiave configurata. Sono pronto.");
            } else {
                alert("Inserisci una chiave API valida!");
            }
        };

        // Sintesi Vocale (Text-To-Speech)
        window.speak = function(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'it-IT';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        };

        // Invia Notifiche Browser Nativa
        function sendNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, { 
                    body: body,
                    icon: "https://img.icons8.com/fluency/96/robot.png"
                });
            }
        }

        // ==========================================
        // 2. INTEGRAZIONE GOOGLE CALENDAR (GIS)
        // ==========================================

        window.onload = function() {
            if (typeof google !== 'undefined' && google.accounts) {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: GOOGLE_CLIENT_ID,
                    scope: 'https://www.googleapis.com/auth/calendar.events',
                    callback: (tokenResponse) => {
                        if (tokenResponse.error) {
                            console.error("Errore Google Auth:", tokenResponse.error);
                            return;
                        }
                        googleAccessToken = tokenResponse.access_token;
                        speechBubble.innerText = "Calendario collegato con successo!";
                        speak("Calendario collegato con successo.");
                    },
                });
            }
        };

        window.authenticateGoogle = function() {
            if (tokenClient) {
                tokenClient.requestAccessToken({prompt: 'consent'});
            } else {
                alert("Client ID Google non configurato o libreria non caricata.");
            }
        };

        // Legge gli eventi dal calendario
        async function fetchCalendarEvents() {
            if (!googleAccessToken) {
                authenticateGoogle();
                return "Per accedere al calendario ho aperto la finestra di Google. Autorizza l'app e poi riprova.";
            }
            
            const timeMin = new Date().toISOString();
            try {
                const response = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${timeMin}&maxResults=5&singleEvents=true&orderBy=startTime`, {
                    headers: { 'Authorization': `Bearer ${googleAccessToken}` }
                });
                const data = await response.json();
                
                if (data.items && data.items.length > 0) {
                    return data.items.map(event => {
                        let date = new Date(event.start.dateTime || event.start.date);
                        return `- ${event.summary} il ${date.toLocaleDateString()} alle ${date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
                    }).join(", ");
                } else {
                    return "Nessun evento in programma nel prossimo periodo.";
                }
            } catch (err) {
                return "Errore nella lettura del calendario Google.";
            }
        }

        // Crea un nuovo evento sul calendario
        async function createCalendarEvent(summary, startISO, endISO) {
            if (!googleAccessToken) {
                authenticateGoogle();
                return "Autorizza prima l'accesso a Google Calendar.";
            }

            try {
                const event = {
                    'summary': summary,
                    'start': { 'dateTime': startISO },
                    'end': { 'dateTime': endISO }
                };

                const response = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${googleAccessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(event)
                });

                if (response.ok) {
                    return `Ho creato l'evento "${summary}" nel tuo calendario.`;
                } else {
                    return "Errore durante la creazione dell'evento sul calendario.";
                }
            } catch (err) {
                return "Errore di connessione con Google Calendar.";
            }
        }

        // Elimina un evento cercando una parola chiave nel titolo
        async function deleteCalendarEvent(keyword) {
            if (!googleAccessToken) {
                authenticateGoogle();
                return "Autorizza prima l'accesso a Google Calendar.";
            }

            try {
                // Cerca l'evento corrispondente alla parola chiave
                const searchRes = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?q=${encodeURIComponent(keyword)}`, {
                    headers: { 'Authorization': `Bearer ${googleAccessToken}` }
                });
                const searchData = await searchRes.json();

                if (!searchData.items || searchData.items.length === 0) {
                    return `Non ho trovato nessun evento chiamato "${keyword}" da eliminare.`;
                }

                const eventId = searchData.items[0].id;
                const eventTitle = searchData.items[0].summary;

                // Cancella l'evento trovato
                const deleteRes = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${googleAccessToken}` }
                });

                if (deleteRes.ok) {
                    return `Ho eliminato l'evento "${eventTitle}" dal tuo calendario.`;
                } else {
                    return "Impossibile eliminare l'evento.";
                }
            } catch (err) {
                return "Errore durante l'eliminazione dell'evento.";
            }
        }

        // ==========================================
        // 3. INTEGRAZIONE IA (OPENROUTER)
        // ==========================================

        async function callAI(prompt, systemInstruction = "Sei Holo Agent, un assistente olografico intelligente. Rispondi in modo conciso e naturale in massimo 2 o 3 frasi.") {
            const currentKey = apiKey || localStorage.getItem('openrouter_api_key');
            
            if (!currentKey) {
                speechBubble.innerText = "Inserisci prima la tua chiave OpenRouter in alto!";
                return "Errore: Chiave API mancante.";
            }

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentKey}`,
                        'HTTP-Referer': window.location.origin,
                        'X-Title': 'HoloAgent'
                    },
                    body: JSON.stringify({
                        model: "openrouter/free",
                        messages: [
                            { role: "system", content: systemInstruction },
                            { role: "user", content: prompt }
                        ]
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0].message.content) {
                    return data.choices[0].message.content;
                } else {
                    return "Errore nella risposta dell'IA.";
                }
            } catch (err) {
                return "Errore di connessione con il servizio IA.";
            }
        }

        // ==========================================
        // 4. UTILS PER PROMEMORIA ED ESTRAZIONE TEMPO
        // ==========================================

        function parseTimerDuration(text) {
            let seconds = 10; // Default 10 secondi se non specificato diversamente
            
            const minMatch = text.match(/(\d+)\s*minut[oi]/i);
            const secMatch = text.match(/(\d+)\s*second[oi]/i);
            const oreMatch = text.match(/(\d+)\s*or[ae]/i);

            if (minMatch) seconds = parseInt(minMatch[1]) * 60;
            else if (secMatch) seconds = parseInt(secMatch[1]);
            else if (oreMatch) seconds = parseInt(oreMatch[1]) * 3600;

            return seconds;
        }

        // ==========================================
        // 5. PROCESSORE PRINCIPALE DEI MESSAGGI
        // ==========================================

        async function processMessage(message) {
            const lower = message.toLowerCase();
            
            // --- GESTIONE PROMEMORIA / NOTIFICHE DINAMICHE ---
            if (lower.includes('ricordami di') || lower.includes('imposta un promemoria')) {
                const durationSeconds = parseTimerDuration(message);
                
                let task = message.replace(/ricordami di/i, '').replace(/imposta un promemoria/i, '').trim();
                task = task.replace(/tra\s+\d+\s*(minuti|secondi|ore|minuto|secondo|ora)/i, '').trim();
                if (!task) task = "Promemoria!";

                const durationMs = durationSeconds * 1000;

                setTimeout(() => {
                    sendNotification("Promemoria Holo Agent", task);
                    speak(`Promemoria: ${task}`);
                }, durationMs);

                let tempoReadable = `${durationSeconds} secondi`;
                if (durationSeconds >= 60 && durationSeconds < 3600) tempoReadable = `${Math.floor(durationSeconds/60)} minut${Math.floor(durationSeconds/60) > 1 ? 'i' : 'o'}`;
                else if (durationSeconds >= 3600) tempoReadable = `${Math.floor(durationSeconds/3600)} or${Math.floor(durationSeconds/3600) > 1 ? 'e' : 'a'}`;

                const conferm = `Perfetto! Ti manderò una notifica per "${task}" tra ${tempoReadable}.`;
                speechBubble.innerText = conferm;
                speak(conferm);
                return;
            }

            // --- GESTIONE GOOGLE CALENDAR (CREA, ELIMINA, LEGGI) ---
            if (lower.includes('calendario') || lower.includes('impegni') || lower.includes('evento') || lower.includes('appuntamento')) {
                speechBubble.innerText = "Elaboro la richiesta per il calendario...";

                // Usa l'IA per capire l'intenzione dell'utente (Crea, Elimina o Leggi)
                const now = new Date();
                const systemPrompt = `Oggi è ${now.toISOString()}. Analizza il messaggio dell'utente per Google Calendar e rispondi ESATTAMENTE con un oggetto JSON valido privo di formattazione markdown.
Formato richiesto:
- Se vuole CREARE: {"action": "create", "summary": "Titolo", "startISO": "YYYY-MM-DDTHH:mm:ssZ", "endISO": "YYYY-MM-DDTHH:mm:ssZ"} (durata standard 1 ora se non specificata)
- Se vuole ELIMINARE: {"action": "delete", "keyword": "parola chiave del titolo dell'evento"}
- Se vuole LEGGERE/VEDERE: {"action": "read"}`;

                const jsonString = await callAI(message, systemPrompt);

                try {
                    // Pulisci il testo da eventuali blocchi codice ```json
                    const cleanJson = jsonString.replace(/```json|```/g, '').trim();
                    const intent = JSON.parse(cleanJson);

                    if (intent.action === 'create') {
                        const result = await createCalendarEvent(intent.summary, intent.startISO, intent.endISO);
                        speechBubble.innerText = result;
                        speak(result);
                        return;
                    } else if (intent.action === 'delete') {
                        const result = await deleteCalendarEvent(intent.keyword);
                        speechBubble.innerText = result;
                        speak(result);
                        return;
                    } else {
                        // Di default legge
                        const eventi = await fetchCalendarEvents();
                        if (!googleAccessToken) {
                            speechBubble.innerText = eventi;
                            speak(eventi);
                            return;
                        }
                        const aiSummary = await callAI(`L'utente chiede del calendario. Ecco gli eventi: ${eventi}. Riassumili in modo chiaro e breve.`);
                        speechBubble.innerText = aiSummary;
                        speak(aiSummary);
                        return;
                    }
                } catch (e) {
                    // Se il parsing JSON fallisce, esegui una semplice lettura
                    const eventi = await fetchCalendarEvents();
                    speechBubble.innerText = eventi;
                    speak(eventi);
                    return;
                }
            }

            // --- CHAT IA GENERICA ---
            speechBubble.innerText = "Pensando...";
            const aiResponse = await callAI(message);
            speechBubble.innerText = aiResponse;
            speak(aiResponse);
        }

        // ==========================================
        // 6. EVENTI INTERFACCIA E RICONOSCIMENTO VOCALE
        // ==========================================

        window.sendText = async function() {
            const val = textInput.value.trim();
            if (!val) return;
            textInput.value = '';
            await processMessage(val);
        };

        window.handleKeyPress = async function(e) {
            if (e.key === 'Enter') await window.sendText();
        };

        // Riconoscimento Vocale
        let recognition = null;
        let isListening = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'it-IT';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
                micBtn.innerText = '🔴 Ascolto...';
                speechBubble.innerText = 'Ti sto ascoltando...';
            };

            recognition.onresult = async (event) => {
                const transcript = event.results[0][0].transcript;
                await processMessage(transcript);
            };

            recognition.onerror = () => {
                stopListening();
                speechBubble.innerText = "Non sono riuscito a sentire. Riprova.";
            };

            recognition.onend = () => {
                stopListening();
            };
        } else {
            micBtn.style.display = 'none';
        }

        window.toggleListening = function() {
            if (!recognition) {
                alert("Riconoscimento vocale non supportato da questo browser.");
                return;
            }
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        };

        function stopListening() {
            isListening = false;
            micBtn.classList.remove('listening');
            micBtn.innerText = '🎙️ Parla';
        }
    </script>
</body>
</html>
