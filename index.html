<!DOCTYPE html>
<html lang="it">
<head>
    <script src="https://accounts.google.com/gsi/client" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaci Agent</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background: radial-gradient(circle at center, #0a192f 0%, #020c1b 100%);
            color: #64ffda;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        .config-box {
            width: 100%;
            background: rgba(10, 25, 47, 0.95);
            border: 1px solid #64ffda;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            gap: 8px;
        }
        .config-box input {
            flex: 1;
            background: #020c1b;
            border: 1px solid rgba(100, 255, 218, 0.4);
            border-radius: 6px;
            padding: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .config-box button {
            background: #64ffda;
            color: #0a192f;
            border: none;
            border-radius: 6px;
            padding: 0 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .holo-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
        }
        .speech-bubble {
            background: rgba(10, 25, 47, 0.85);
            border: 1px solid #64ffda;
            color: #e2e8f0;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 16px;
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(100, 255, 218, 0.3);
            position: relative;
            max-width: 90%;
            text-align: center;
            animation: floatBubble 3s ease-in-out infinite;
        }
        .avatar-container {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(100,255,218,0.2), rgba(0,122,255,0.2));
            border: 2px solid #64ffda;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(100, 255, 218, 0.4), inset 0 0 20px rgba(100, 255, 218, 0.2);
            position: relative;
            animation: floatAvatar 3s ease-in-out infinite;
        }
        .avatar-face {
            font-size: 50px;
            color: #64ffda;
        }
        .pod {
            width: 220px;
            height: 50px;
            background: linear-gradient(to bottom, #112240, #0a192f);
            border: 2px solid #64ffda;
            border-radius: 50%;
            margin-top: 30px;
            box-shadow: 0 0 25px rgba(100, 255, 218, 0.5), inset 0 0 10px rgba(100, 255, 218, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .pod span {
            font-size: 24px;
            font-weight: bold;
            color: #64ffda;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #64ffda;
        }
        .light-beam {
            position: absolute;
            top: -30px;
            width: 120px;
            height: 40px;
            background: linear-gradient(to top, rgba(100, 255, 218, 0.2), transparent);
            clip-path: polygon(20% 100%, 80% 100%, 100% 0%, 0% 0%);
        }
        .controls-panel {
            width: 100%;
            background: rgba(10, 25, 47, 0.9);
            border: 1px solid rgba(100, 255, 218, 0.3);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .input-row {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            background: #020c1b;
            border: 1px solid #64ffda;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        button.action-btn {
            background: #64ffda;
            color: #0a192f;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button.action-btn:hover { background: #52e0bc; }
        .mic-btn {
            background: #ff5c5c;
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .mic-btn.listening {
            background: #ff3b3b;
            animation: pulse 1.5s infinite;
        }
        @keyframes floatAvatar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes floatBubble {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 92, 92, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(255, 92, 92, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 92, 92, 0); }
        }
    </style>
</head>
    <!-- Pulsante nascosto per l'autenticazione di Google (richiesto da Google GIS) -->
<button id="authBtn" onclick="authenticateGoogle()" style="display: none;"></button>
<body>

    <div class="container">
        <!-- Input per configurare la chiave API di Groq -->
        <div class="config-box">
            <input type="password" id="apiKeyInput" placeholder="Incolla qui la tua API Key (es. gsk_...)">
            <button onclick="saveApiKey()">Salva</button>
        </div>

        <!-- Area Olografica -->
        <div class="holo-stage">
            <div class="speech-bubble" id="speechBubble">Hello! Inserisci la tua chiave per iniziare.</div>
            
            <div class="avatar-container">
                <div class="light-beam"></div>
                <div class="avatar-face">🤖</div>
            </div>
            
            <div class="pod">
                <span>B</span>
            </div>
        </div>

        <!-- Pannello Controlli -->
        <div class="controls-panel">
            <button id="micBtn" class="mic-btn" onclick="toggleListening()">🎙️ Parla a voce</button>
            <div class="input-row">
                <input type="text" id="textInput" placeholder="Chiedi qualcosa all'agente..." onkeypress="handleKeyPress(event)">
                <button class="action-btn" onclick="sendText()">Invia</button>
            </div>
        </div>
    </div>

 <script>
        const speechBubble = document.getElementById('speechBubble');
        const textInput = document.getElementById('textInput');
        const micBtn = document.getElementById('micBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');

        // Carica la chiave di OpenRouter salvata
        let apiKey = localStorage.getItem('openrouter_api_key') || '';
        if (apiKey) {
            apiKeyInput.value = '••••••••••••••••';
        }

        window.saveApiKey = function() {
            const val = apiKeyInput.value.trim();
            if (val && !val.startsWith('•')) {
                apiKey = val;
                localStorage.setItem('openrouter_api_key', apiKey);
                speechBubble.innerText = "Chiave OpenRouter salvata!";
                speak("Chiave configurata. Pronto.");
            } else {
                alert("Inserisci una chiave API valida!");
            }
        }
const CLIENT_ID = '365223537670-qq78cpra1rljkf3gd1iq3dpk654c68il.apps.googleusercontent.com'; 
        let googleAccessToken = null;
        let tokenClient;

        // Inizializza il client di Google in background
        window.onload = function() {
            if (typeof google !== 'undefined' && google.accounts) {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID,
                    scope: 'https://www.googleapis.com/auth/calendar.events', // Permessi di lettura e scrittura
                    callback: (tokenResponse) => {
                        if (tokenResponse.error) {
                            console.error("Errore Google Auth:", tokenResponse.error);
                            return;
                        }
                        googleAccessToken = tokenResponse.access_token;
                        speak("Calendario collegato con successo. Adesso posso gestirlo.");
                    },
                });
            }
        };

        window.authenticateGoogle = function() {
            if (tokenClient) {
                tokenClient.requestAccessToken({prompt: ''}); // Tenta di connettersi
            }
        };

        // Funzione per leggere il calendario
        async function fetchCalendarEvents() {
            if (!googleAccessToken) {
                // Se manca il token, attiva automaticamente il login di Google in background
                authenticateGoogle();
                return "Attendere prego: sto autorizzando l'accesso al calendario. Per favore, ripeti la richiesta tra un istante dopo aver completato il popup.";
            }
            
            const timeMin = new Date().toISOString();
            try {
                const response = `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${timeMin}&maxResults=5&singleEvents=true&orderBy=startTime`;
                const res = await fetch(response, {
                    headers: { 'Authorization': `Bearer ${googleAccessToken}` }
                });
                const data = await res.json();
                
                if (data.items && data.items.length > 0) {
                    return data.items.map(event => {
                        let date = new Date(event.start.dateTime || event.start.date);
                        return `- ${event.summary} il ${date.toLocaleDateString()} alle ${date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
                    }).join(", ");
                } else {
                    return "Nessun evento in programma nel prossimo periodo.";
                }
            } catch (err) {
                return "Errore nella lettura del calendario.";
            }
        }

        // Funzione per CREARE o MODIFICARE un evento nel calendario
        async function createCalendarEvent(summary, dateTimeString) {
            if (!googleAccessToken) {
                authenticateGoogle();
                return "Devi prima autorizzare l'accesso al calendario. Ho aperto la richiesta, riprova tra un attimo.";
            }

            try {
                // Esempio di creazione evento rapido
                const event = {
                    'summary': summary,
                    'start': { 'dateTime': dateTimeString },
                    'end': { 'dateTime': new Date(new Date(dateTimeString).getTime + 60*60*1000).toISOString() } // Durata 1 ora di default
                };

                const response = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${googleAccessToken}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(event)
                });
                
                if (response.ok) {
                    return `Ho aggiunto con successo l'evento: "${summary}" sul tuo calendario.`;
                } else {
                    return "Non sono riuscito a salvare l'evento sul calendario.";
                }
            } catch (err) {
                return "Errore di connessione durante la scrittura sul calendario.";
            }
        }
        // Sintesi Vocale (Text-to-Speech)
        window.speak = function(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'it-IT';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Chiamata all'API di OpenRouter
        async function callAI(prompt) {
            const currentKey = apiKey || localStorage.getItem('openrouter_api_key');
            
            if (!currentKey) {
                speechBubble.innerText = "Inserisci prima la tua chiave OpenRouter in alto!";
                return "Errore: Chiave API mancante.";
            }

            speechBubble.innerText = "Elaborazione in corso...";
            
            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentKey}`,
                        'HTTP-Referer': window.location.origin,
                        'X-Title': 'HoloAgent'
                    },
                    body: JSON.stringify({
                        model: "openrouter/free", // Router automatico gratuito di OpenRouter
                        messages: [
                            {
                                role: "system",
                                content: "Sei un assistente olografico avanzato. Rispondi in modo conciso, diretto e in massimo 2 frasi."
                            },
                            {
                                role: "user",
                                content: prompt
                            }
                        ]
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0].message.content) {
                    return data.choices[0].message.content;
                } else if (data.error) {
                    return "Errore OpenRouter: " + data.error.message;
                } else {
                    return "Errore nella risposta.";
                }
            } catch (err) {
                return "Errore di connessione.";
            }
        }

        async function processMessage(message) {
            const lower = message.toLowerCase();
            
            if (lower.startsWith('chiama') || lower.startsWith('effettua chiamata')) {
                const contact = message.replace(/chiama|effettua chiamata/gi, '').trim();
                const text = `Avvio della chiamata verso ${contact || 'contatto'} in corso...`;
                speechBubble.innerText = text;
                speak(text);
                return;
            }
            
            if (lower.startsWith('manda messaggio') || lower.startsWith('invia messaggio')) {
                const text = "Interfaccia messaggi attivata. Dettagli trasmessi.";
                speechBubble.innerText = text;
                speak(text);
                return;
            }
            

            const aiResponse = await callAI(message);
            speechBubble.innerText = aiResponse;
            speak(aiResponse);
        }

        window.sendText = async function() {
            const val = textInput.value;
            if (!val) return;
            textInput.value = '';
            await processMessage(val);
        }

        window.handleKeyPress = async function(e) {
            if (e.key === 'Enter') await window.sendText();
        }

        // Riconoscimento Vocale Nativo
        let recognition = null;
        let isListening = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'it-IT';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
                micBtn.innerText = '🔴 In ascolto...';
                speechBubble.innerText = 'Ti sto ascoltando...';
            };

            recognition.onresult = async (event) => {
                const transcript = event.results[0][0].transcript;
                await processMessage(transcript);
            };

            recognition.onerror = () => {
                stopListening();
                speechBubble.innerText = "Errore audio. Riprova.";
            };

            recognition.onend = () => {
                stopListening();
            };
        } else {
            micBtn.style.display = 'none';
        }

        window.toggleListening = function() {
            if (!recognition) {
                alert("Il tuo browser non supporta il riconoscimento vocale.");
                return;
            }
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        function stopListening() {
            isListening = false;
            micBtn.classList.remove('listening');
            micBtn.innerText = '🎙️ Parla a voce';
        }
    </script>
</body>
</html>
